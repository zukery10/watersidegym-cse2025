<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
	<title>Create Account</title>
</h:head>
<h:body>
	<h:form>
		<h2>Create Account</h2>
		<h:messages globalOnly="true" style="color:red;" />
		<!-- Email -->
		<h:outputLabel for="email" value="Email:" />
		<h:inputText id="email" value="#{createAccountBean.user.email}"
			required="true" requiredMessage="Email is required."
			validatorMessage="Incorrect e-mail format">
			<f:validateRegex pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$" />
		</h:inputText>

		<h:message for="email" style="color:red" />

		<br />
		<br />

		<!-- Password -->
		<h:outputLabel for="password" value="Password:" />
		<h:inputSecret id="password"
			value="#{createAccountBean.user.password}" required="true"
			requiredMessage="Password is required."
			validatorMessage="Password must have 8+ chars, one uppercase and one digit">
			<f:validateRegex pattern="^(?=.*[A-Z])(?=.*\d).{8,}$" />
		</h:inputSecret>
		<h:message for="password" style="color:red" />

		<br />
		<br />

		<!-- First Name -->
		<h:outputLabel for="firstName" value="First Name:" />
		<h:inputText id="firstName"
			value="#{createAccountBean.user.firstName}" required="true"
			requiredMessage="First name is required."
			validatorMessage="First name must be at least 2 characters.">
			<f:validateLength minimum="2" maximum="50" />
		</h:inputText>

		<h:message for="firstName" style="color:red" />

		<br />
		<br />

		<!-- Second Name -->
		<h:outputLabel for="secondName" value="Second Name:" />
		<h:inputText id="secondName"
			value="#{createAccountBean.user.secondName}" required="true"
			requiredMessage="Second name is required."
			validatorMessage="Second name must be at least 2 characters.">
			<f:validateLength minimum="2" maximum="50" />
		</h:inputText>

		<h:message for="secondName" style="color:red" />

		<br />
		<br />

		<!-- Address 1 -->
		<h:outputLabel for="address1" value="Address Line 1:" />
		<h:inputText id="address1" value="#{createAccountBean.user.address1}"
			required="true" requiredMessage="Address Line 1 is required." />
		<h:message for="address1" style="color:red" />

		<br />
		<br />

		<!-- Address 2 -->
		<h:outputLabel for="address2" value="Address Line 2:" />
		<h:inputText id="address2" value="#{createAccountBean.user.address2}" />
		<h:message for="address2" style="color:red" />

		<br />
		<br />

		<!-- County -->
		<h:outputLabel for="county" value="County:" />
		<h:selectOneMenu id="county" value="#{createAccountBean.user.county}"
			required="true" requiredMessage="County is required.">
			<f:selectItem itemLabel="Select a County" itemValue="" />
			<f:selectItem itemValue="Carlow" itemLabel="Carlow" />
			<f:selectItem itemValue="Cavan" itemLabel="Cavan" />
			<f:selectItem itemValue="Clare" itemLabel="Clare" />
			<f:selectItem itemValue="Cork" itemLabel="Cork" />
			<f:selectItem itemValue="Donegal" itemLabel="Donegal" />
			<f:selectItem itemValue="Dublin" itemLabel="Dublin" />
			<f:selectItem itemValue="Galway" itemLabel="Galway" />
			<f:selectItem itemValue="Kerry" itemLabel="Kerry" />
			<f:selectItem itemValue="Kildare" itemLabel="Kildare" />
			<f:selectItem itemValue="Kilkenny" itemLabel="Kilkenny" />
			<f:selectItem itemValue="Laois" itemLabel="Laois" />
			<f:selectItem itemValue="Leitrim" itemLabel="Leitrim" />
			<f:selectItem itemValue="Limerick" itemLabel="Limerick" />
			<f:selectItem itemValue="Longford" itemLabel="Longford" />
			<f:selectItem itemValue="Louth" itemLabel="Louth" />
			<f:selectItem itemValue="Mayo" itemLabel="Mayo" />
			<f:selectItem itemValue="Meath" itemLabel="Meath" />
			<f:selectItem itemValue="Monaghan" itemLabel="Monaghan" />
			<f:selectItem itemValue="Offaly" itemLabel="Offaly" />
			<f:selectItem itemValue="Roscommon" itemLabel="Roscommon" />
			<f:selectItem itemValue="Sligo" itemLabel="Sligo" />
			<f:selectItem itemValue="Tipperary" itemLabel="Tipperary" />
			<f:selectItem itemValue="Waterford" itemLabel="Waterford" />
			<f:selectItem itemValue="Westmeath" itemLabel="Westmeath" />
			<f:selectItem itemValue="Wexford" itemLabel="Wexford" />
			<f:selectItem itemValue="Wicklow" itemLabel="Wicklow" />
		</h:selectOneMenu>
		<h:message for="county" style="color:red" />

		<br />
		<br />

		<!-- Eircode -->
		<h:outputLabel for="eircode" value="Eircode:" />
		<h:inputText id="eircode" value="#{createAccountBean.user.eircode}"
			required="true" requiredMessage="Eircode is required."
			validatorMessage="Eircode must be exactly 7 alphanumeric characters">
			<f:validateRegex pattern="^[A-Za-z0-9]{7}$" />
		</h:inputText>
		<h:message for="eircode" style="color:red" />

		<br />
		<br />

		<!-- Phone Number -->
		<h:outputLabel for="phone" value="Phone Number:" />
		<h:inputText id="phone" value="#{createAccountBean.user.phoneNumber}"
			required="true" requiredMessage="Phone number is required."
			validatorMessage="Phone number must start with 08, then a digit from 3-9, followed by 7 digits">
			<f:validateRegex pattern="^08[3-9][0-9]{7}$" />
		</h:inputText>
		<h:message for="phone" style="color:red" />

		<br />
		<br />
		<!-- Date of Birth -->
		<h:outputLabel for="dob" value="Date of Birth:" />
		<h:inputText id="dob" value="#{createAccountBean.user.dateOfBirth}"
			required="true" requiredMessage="Date of birth is required."
			converterMessage="Invalid date format. Please use dd-MM-yyyy.">
			<f:convertDateTime pattern="dd-MM-yyyy" />
		</h:inputText>
		<h:message for="dob" style="color:red" />
		<small>Format: dd-MM-yyyy</small>

		<br />
		<br />

		<!-- Gender -->
		<h:outputLabel for="gender" value="Gender:" />
		<h:selectOneMenu id="gender" value="#{createAccountBean.user.gender}"
			required="true" requiredMessage="Please select a gender.">
			<f:selectItem itemLabel="Select..." itemValue="" />
			<f:selectItem itemLabel="Male" itemValue="Male" />
			<f:selectItem itemLabel="Female" itemValue="Female" />
			<f:selectItem itemLabel="Other" itemValue="Other" />
		</h:selectOneMenu>
		<h:message for="gender" style="color:red" />

		<br />
		<br />

		<h:commandButton value="Register"
			action="#{createAccountBean.register}" />
		<br />
		<br />
		<h:commandButton value="Print Users (Debug)"
			action="#{createAccountBean.printUsersToConsole}" immediate="true" />
	</h:form>

</h:body>
</html>
