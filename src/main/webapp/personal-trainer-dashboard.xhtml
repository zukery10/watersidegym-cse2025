<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<f:metadata>
  <f:event type="preRenderView" listener="#{loginBean.checkLoggedIn}" />
</f:metadata>

<h:head>
  <h:outputStylesheet library="css" name="styles.css" />
  <title>Personal Trainer Dashboard</title>
</h:head>

<h:body>



  <!-- background image -->
  <section class="dashboard-bg"
           style="background-image:url('#{request.contextPath}/resources/images/PT_bg_image.png');
                  background-size:cover;
                  background-position:center;
                  background-repeat:no-repeat;">

    

      <main class="main-section" style="text-align:center">
        <h1>Personal Trainer Dashboard</h1>
        <h3>Login Successful</h3>

        <!-- User card -->
        <div class="plans" style="justify-content:center">
          <div class="plan-card" style="max-width:520px; width:100%">
            <h2 style="margin-top:0">
              #{loginBean.loggedInUser.firstName} #{loginBean.loggedInUser.secondName}
            </h2>

            <h:form>
              <h:commandButton value="Logout"
                               action="#{loginBean.logout}"
                               styleClass="choose-btn"
                               style="width:100%" />
            </h:form>
          </div>
        </div>

        
        <!-- Unified vertical buttons -->
<div class="stack-actions">

  <!-- Video Gallery -->
  <h:link outcome="video-gallery" styleClass="stack-btn">  <!-- Quick Links line here -->
    <span class="icon">🎬</span>
    <span class="text">
      <span class="title">Video Gallery</span>
      <span class="sub">Browse classes &amp; workouts</span>
    </span>
    <span class="cta">→</span>
  </h:link>

  <!-- Upload Video -->
  <h:link outcome="PT-add-video" styleClass="stack-btn">   <!-- Quick Links line here -->
    <span class="icon">⤴️</span>
    <span class="text">
      <span class="title">Upload Video</span>
      <span class="sub">Share a new session</span>
    </span>
    <span class="cta">→</span>
  </h:link>

  <!-- 1:1 Sessions -->
  <h:link outcome="sessions" styleClass="stack-btn">   <!-- Quick Links line here -->
    <span class="icon">📅</span>
    <span class="text">
      <span class="title">1:1 Sessions</span>
      <span class="sub">View your bookings</span>
    </span>
    <span class="cta">→</span>
  </h:link>

</div>


      </main>
    
  </section>

</h:body>
</html>
