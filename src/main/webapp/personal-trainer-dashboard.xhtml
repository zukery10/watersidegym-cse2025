<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

<f:metadata>
	<f:event type="preRenderView" listener="#{loginBean.checkLoggedIn}" />
</f:metadata>

<h:head>

	<h:outputStylesheet library="css" name="styles.css" />
	<title>Personal Trainer Dashboard</title>
</h:head>

<h:body>


	<!-- header -->
	<ui:include src="/includes/header.xhtml" />

	<!-- background image -->
	<section class="dashboard-bg"
		style="background-image:url('#{request.contextPath}/resources/images/PT_bg_image.png');
                  background-size:cover;
                  background-position:center;
                  background-repeat:no-repeat;">

		<main class="main-section" style="text-align: center">
			<h1>
				Personal Trainer <span class="highlight">Dashboard</span>
			</h1>
				<h:messages globalOnly="true" layout="table"
					style="margin:12px 0; color:green; text-align:center; margin-left:auto; margin-right:auto;" />

			<!-- User card with form styling -->
			<div class="plans">
			<div class="plan-card soft-panel">
					<!-- Unified vertical buttons -->
					<div class="stack-actions">

						<!-- Video Gallery -->
						<h:link outcome="video-gallery" styleClass="stack-btn">
							<!-- Quick Links line here -->
							<span class="icon">🎬</span>
							<span class="text"> <span class="title">Video Gallery</span></span>
						</h:link>

						<!-- Upload Video -->
						<h:link outcome="PT-add-video" styleClass="stack-btn">
							<!-- Quick Links line here -->
							<span class="icon">⤴️</span>
							<span class="text"> <span class="title">Upload
									Video</span></span>
						</h:link>

					</div>
				</div>
				<div class="plan-card soft-panel">
					<h2 style="margin-top: 0">#{loginBean.loggedInUser.firstName}
						#{loginBean.loggedInUser.secondName}</h2>

					<h:form>
						<!-- Date Filter Section with Form Styling -->
						<div class="form-group">
							<div class="form-row"
								style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap; justify-content: center;">
								<h:outputLabel for="date" value="Select Date:"
									styleClass="form-label" style="margin: 0; white-space: nowrap;" />
								<h:inputText id="date" value="#{ptSessionBean.selectedDate}"
									styleClass="form-control"
									style="flex: 1; min-width: 150px; max-width: 200px;"
									pt:type="date" pt:min="#{ptSessionBean.todayIso}">
									<f:convertDateTime pattern="yyyy-MM-dd"
										timeZone="Europe/Dublin" />
								</h:inputText>
								<h:commandButton value="Filter"
									action="#{ptSessionBean.filterSessionsByDate}"
									styleClass="choose-btn" style="white-space: nowrap;" />
							</div>
						</div>

						<!-- Results Table -->
						<h:panelGroup
							rendered="#{not empty ptSessionBean.filteredSessions}">
							<div style="overflow-x: auto;">
								<h:dataTable value="#{ptSessionBean.filteredSessions}" var="s"
									styleClass="jsf-table" style="width: 100%; margin: 20px 0;">
									<h:column>
										<f:facet name="header">Member</f:facet>
										#{s.member.firstName} #{s.member.secondName}
									</h:column>
									<h:column>
										<f:facet name="header">Date</f:facet>
										<h:outputText value="#{s.sessionDate}">
											<f:convertDateTime pattern="EEE, MMM d, yyyy"
												timeZone="Europe/Dublin" />
										</h:outputText>
									</h:column>
									<h:column>
										<f:facet name="header">Time</f:facet>
										#{s.startTime}
									</h:column>
									<h:column>
										<f:facet name="header">Duration</f:facet>
										#{s.durationMinutes} min
									</h:column>
								</h:dataTable>
							</div>
						</h:panelGroup>

						<h:panelGroup rendered="#{empty ptSessionBean.filteredSessions}">
							<h:outputText value="No PT sessions scheduled for this date."
								style="color: #e74c3c; font-weight: bold; display: block; margin: 20px 0; padding: 15px; background: #fdf2f2; border-radius: 5px; border: 1px solid #f5c6cb;" />
						</h:panelGroup>
					</h:form>
				</div>

				
			</div>




		</main>

	</section>
</h:body>
</html>
