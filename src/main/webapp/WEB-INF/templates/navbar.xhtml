<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<link rel="stylesheet"
      href="#{resource['css:navbar.css']}?v=#{now.time}" />

    <header class="navbar">
        <div class="logo">
            <h:graphicImage library="images" name="logo-name.jpg"
                            style="height:40px; vertical-align:middle; margin-right:10px;" />
            <span class="site-name">Waterside Gym</span>
            <span class="tagline">A Fit for Your Life</span>
        </div>
        <div class="logout-link">
            <h:form>
                <h:commandLink value="Logout" action="#{loginBean.logout}" styleClass="logout-btn" />
            </h:form>
        </div>
    </header>
</ui:composition>
