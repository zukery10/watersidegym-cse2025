<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<f:metadata>
	<f:event type="preRenderView" listener="#{loginBean.checkLoggedIn}" />

</f:metadata>
<h:head>
	<title>Non Member Video Gallery</title>
	<h:outputStylesheet library="css" name="styles.css" />
</h:head>

<h:body>
<ui:include src="/includes/header.xhtml" />
	<main class="main-section">
		<div class="vg-container">
			<div class="vg-titlebar">
				<h1 class="vg-page-title">
					Public<span class="highlight"> Videos</span>
				</h1>
			</div>
			<h:form>
				<div class="form-group">
					<div class="form-row"
						style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap; justify-content: center;">

						<h:outputLabel for="trainer" value="Choose Trainer"
							styleClass="form-label" style="margin: 0; white-space: nowrap;" />

						<h:selectOneMenu value="#{videoService.selectedTrainerName}"
							id="trainer" styleClass="form-control"
							style="flex: 1; min-width: 150px; max-width: 200px;">
							<f:selectItem itemLabel="-- All Videos --" itemValue="" />
							<f:selectItems value="#{videoService.trainers}" var="t"
								itemLabel="#{t.firstName} #{t.secondName}"
								itemValue="#{t.firstName} #{t.secondName}" />
						</h:selectOneMenu>

						<h:message for="trainer" errorClass="field-error" />

						<h:commandButton value="Filter by Trainer"
							action="#{videoService.showPublicVideosFilteredByTrainer()}"
							styleClass="choose-btn" style="white-space: nowrap;" />
						<h:commandButton value="Back to Dashboard"
							action="nonmember-dashboard.xhtml?faces-redirect=true"
							styleClass="choose-btn" />
					</div>
				</div>
			</h:form>

			<section class="vg-section">
				<div class="vg-section-head"></div>

				<div class="vg-grid">
					<ui:repeat
						value="#{videoService.showPublicVideosFilteredByTrainer()}"
						var="v">
						<article class="vg-card">
							<div class="vg-thumb">
								<video controls="controls" preload="metadata">
									<source src="#{request.contextPath}#{v.link}" type="video/mp4" />
								</video>
								<span class="vg-duration">#{v.date}</span>
							</div>
							<div class="vg-meta">
								<h3 class="vg-title">#{v.title}</h3>
								<p class="vg-by">#{v.uploadedBy}</p>
							</div>
						</article>
					</ui:repeat>
				</div>
			</section>
		</div>
	</main>
</h:body>
</html>
