<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:metadata>
	<f:event type="preRenderView" listener="#{loginBean.checkLoggedIn}" />
</f:metadata>
<h:head>
	<h:outputStylesheet name="styles.css" library="css" />
	<title>Member Dashboard</title>
</h:head>
<h:body>

	<header class="navbar">
		<div class="logo">
			Waterside Gym <span class="tagline">A Fit for Your Life</span>
		</div>
	</header>

	<main class="main-section">
		<h1>Member Dashboard</h1>
		<h3>Login Successful</h3>
		<h:form id="loginForm" styleClass="form-container">


			<div class="plans">
				<div class="plan-card">
					<h:panelGroup rendered="#{not empty loginBean.loggedInUser}">
						<h3>Welcome, #{loginBean.loggedInUser.firstName}
							#{loginBean.loggedInUser.secondName}!</h3>
						<p>Email: #{loginBean.loggedInUser.email}</p>
						<p>Role: #{loginBean.loggedInUser.role}</p>
					</h:panelGroup>

					<h:form>
						<h:commandButton value="Browse Classes"
							action="browseClasses?faces-redirect=true" styleClass="choose-btn" />
							<br></br><br></br>
						<h:commandButton value="Logout" action="#{loginBean.logout}" styleClass="choose-btn" />
					</h:form>
				</div>
			</div>
		</h:form>

	</main>
</h:body>

</html>
