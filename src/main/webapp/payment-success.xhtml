<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<f:metadata>
	<f:event type="preRenderView" listener="#{loginBean.checkLoggedIn}" />
</f:metadata>
      
<h:head>
<h:head>
    <title>Payment Successful</title>
    <!--  for redirection redirected shortly -->
    <meta http-equiv="refresh" content="12; URL=index.xhtml"/>
    <link rel="stylesheet" type="text/css" href="resources/css/membership_select_page.css"/>
</h:head></h:head>

<h:body>
	<!--  the nav to be incuded in all pages -->	
	<ui:include src="/includes/header.xhtml" />

    <main class="main-section">
        <div class="success-box">
            <h1 style="margin-bottom: 10px;">Payment <span class="highlight">Successful</span></h1>

			            
            <p class="subtitlePlans">
    		Payment of <span class="success-price">
			  <h:outputText value="#{membershipBean.membershipPlan.price}">
			    <f:convertNumber type="currency" currencySymbol="€" maxFractionDigits="2" minFractionDigits="2"/>
			  </h:outputText>
			</span> was successfully processed.</p>
            <p class="subtitlePlans" style="margin-top: 0;">
                Thank you for purchasing the <strong>#{membershipBean.membershipPlan.label}</strong> membership!
            </p>
            <p class="subtitlePlans">A confirmation email has been sent to your account.</p>
            <a href="index.xhtml" class="join-now" style="display:inline-block;margin-top:20px;">Return to Home</a>
            <p class="subtitlePlans" style="font-size: 13px; margin-top: 20px;">
			    You will be redirected shortly...
			</p>
            
        </div>
    </main>
</h:body>
</html>
