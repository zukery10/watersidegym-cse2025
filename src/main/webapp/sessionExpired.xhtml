<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
	<title>Session Expired</title>
	<link rel="stylesheet" type="text/css"
		href="resources/css/membership_select_page.css" />
</h:head>

<h:body>

	<!--  the nav to be included in all pages -->
	<ui:include src="/includes/header.xhtml" />

	<main class="main-section">
		<h1>
			Session <span class="highlight">Expired</span>
		</h1>

		<div class="plan-card payment-form">
			<p class="subtitle" style="color: red; font-weight: bold;">Your
				payment session has expired due to inactivity.</p>

			<!-- Membership payment expired -->
			<h:panelGroup rendered="#{not gymClassBean.classPayment}">
				<p class="subtitle2">Please select your membership plan again to
					restart the payment process.</p>
				<h:link outcome="purchase-membership.xhtml"
					styleClass="form-down-btn" value="Return to Membership Selection" />
			</h:panelGroup>

			<!-- Class cart payment expired -->
			<h:panelGroup rendered="#{gymClassBean.classPayment}">
				<p class="subtitle2">Your class booking session has expired.
					Classes have been released back to the system.</p>
				<h:form>
					<h:commandButton value="Back to Dashboard" 
						action="#{gymClassBean.resetNonMemberCartAndTimerAndRedirect}"
						styleClass="choose-btn" />
				</h:form>
			</h:panelGroup>
		</div>

	</main>
</h:body>
</html>
