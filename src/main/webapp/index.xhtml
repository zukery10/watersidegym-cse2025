<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<title>Login Page</title>
	<h:outputStylesheet name="styles.css" library="css" />
</h:head>
<h:body>
	<header class="navbar">
		<div class="logo">
			Waterside Gym <span class="tagline">A Fit for Your Life</span>
		</div>
	</header>
	<main class="main-section">
		<h1>
			Log<span class="highlight">in</span>
		</h1>
		<h:form id="loginForm" styleClass="form-container">







			<div class="plans">
				<div class="plan-card">
					<h:messages styleClass="error" />



					<div class="form-group">
						<div class="form-row">
							<h:outputLabel for="email" value="Email:" />
							<h:inputText id="email" value="#{loginBean.email}"
								styleClass="inputField" required="true"
								requiredMessage="Must input Email" />
						</div>
					</div>


					<div class="form-group">
						<div class="form-row">
							<h:outputLabel for="password" value="Password:" />
							<h:inputSecret id="password" value="#{loginBean.password}"
								styleClass="inputField" />
						</div>
					</div>




					<!-- Functional "Login" button -->
					<h:commandButton value="Login" action="#{loginBean.login}"
						styleClass="choose-btn" />
					<br /> <br />
					<!-- Functional "Create Account" button -->
					<h:commandButton value="Create Account"
						action="create-account?faces-redirect=true" immediate="true"
						styleClass="choose-btn" />
				</div>
			</div>

		</h:form>
	</main>

</h:body>
</html>
