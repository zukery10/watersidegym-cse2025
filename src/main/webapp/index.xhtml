<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets">
<h:head>
	<title>Login Page</title>
</h:head>
<h:body>
	<h:form>
		<h2>Login</h2>

		<h:outputLabel for="email" value="Email:" />

		<h:inputText id="email" value="#{loginBean.email}" required="true" />




		<br />
		<br />

		<h:outputLabel for="password" value="Password:" />

		<h:inputSecret id="password" value="#{loginBean.password}"
			required="true" />

		<br />
		<br />

		<!-- Functional "Login" button -->
		<h:commandButton value="Login" action="#{loginBean.login}" />
		
		<h:messages style="color:red" />

		<!-- Functional "Create Account" button -->
		<h:commandButton value="Create Account"
			action="create-account?faces-redirect=true" immediate="true" />

	</h:form>
</h:body>
</html>
