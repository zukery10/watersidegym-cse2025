<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets">

<h:head>
    <title>Book PT Session</title>
   <h:outputStylesheet name="styles.css" library="css" />
</h:head>

<h:body>

	<main class="main-section">
		<div class="logo">
			Book Personal Training Session
		</div>
	
   

    <form>
       <div class="plans">
				<div class="plan-card">
	<h3>Member: #{loginBean.loggedInUser.firstName} #{loginBean.loggedInUser.lastName}</h3>

           
            <label for="trainer">Choose Trainer</label>
            <select id="trainer" name="trainer">
                <option value="">-- Select Trainer --</option>
                <option value="T3">Joe Soundman (Cardio)</option>
				<option value="T1">Alex Byrne (Strength)</option>
                <option value="T2">Priya Shah (Mobility)</option>                
            </select>
            <br/><br/>

           
            <label for="date">Date</label>
            <input type="date" id="date" name="date" />
            <br/><br/>

          
            <label>Time</label><br/>
            <input type="radio"  name="time" value="08:00" />
            <label for="time8">8:00 AM</label><br/>

            <input type="radio" id="time9" name="time" value="09:00" />
            <label for="time9">9:00 AM</label><br/>

            <input type="radio" name="time" value="17:00" />
            <label for="time17">5:00 PM</label><br/>

            <input type="radio"  name="time" value="18:00" />
            <label for="time18">6:00 PM</label><br/><br/>

           
           <!--  <button type="submit">Book</button>  -->
            
             <h:commandButton value="Book"
                         action="#{ptSessionBean.book}"
                         onclick="alert('Your booking is confirmed!');" />
        </div>
        </div>
    </form>
    </main>
</h:body>
</html>
