<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">
<f:metadata>
	<f:event type="preRenderView" listener="#{loginBean.checkLoggedIn}" />
</f:metadata>
<h:head>
	<title>Book PT Session</title>
	<h:outputStylesheet name="styles.css" library="css" />
</h:head>
<h:body>
<!-- header -->
	<ui:include src="/includes/header.xhtml" />
	<main class="main-section">
		<h1>
			Book Personal <span class="highlight">Training Session</span>
		</h1>
		<h:form id="ptForm">
			<div class="plans">
				<div class="plan-card">
					<!-- Trainer -->
					<div class="form-group">
						<div class="form-row">
							<h:outputLabel for="trainer" value="Choose Trainer:"
								styleClass="form-label" />
							<h:selectOneMenu id="trainer"
								value="#{ptSessionBean.selectedTrainerName}" required="true"
								requiredMessage="Trainer is required." styleClass="form-control">
								<f:selectItem itemLabel="-- Select Trainer --" itemValue="" />
								<f:selectItems value="#{ptSessionBean.trainers}" var="t"
									itemLabel="#{t.firstName} #{t.secondName}"
									itemValue="#{t.firstName} #{t.secondName}" />
							</h:selectOneMenu>
						</div>
						<h:message for="trainer" styleClass="error-message" />
					</div>

					<!-- Date -->
					<div class="form-group">
						<div class="form-row">
							<h:outputLabel for="date" value="Select Date:"
								styleClass="form-label" />
							<h:inputText id="date"
								value="#{ptSessionBean.ptSession.sessionDate}" required="true"
								requiredMessage="Date is required." styleClass="form-control"
								pt:type="date" pt:min="#{ptSessionBean.todayIso}">
								<f:convertDateTime pattern="yyyy-MM-dd" timeZone="Europe/Dublin" />
							</h:inputText>
						</div>
						<h:message for="date" styleClass="error-message" />
					</div>

					<!-- Time -->
					<div class="form-group">
						<div class="form-row">
							<h:outputLabel for="time" value="Time:" styleClass="form-label" />
							<h:selectOneRadio id="time"
								value="#{ptSessionBean.ptSession.startTime}" required="true"
								requiredMessage="Time is required." layout="pageDirection"
								styleClass="radio-group">
								<f:selectItem itemValue="08:00" itemLabel="8:00 AM" />
								<f:selectItem itemValue="09:00" itemLabel="9:00 AM" />
								<f:selectItem itemValue="17:00" itemLabel="5:00 PM" />
								<f:selectItem itemValue="18:00" itemLabel="6:00 PM" />
							</h:selectOneRadio>
						</div>
						<h:message for="time" styleClass="error-message" />
					</div>

					<!-- Duration -->
					<div class="form-group">
						<div class="form-row">
							<h:outputLabel for="dur" value="Duration:"
								styleClass="form-label" />
							<h:selectOneMenu id="dur"
								value="#{ptSessionBean.ptSession.durationMinutes}"
								required="true" requiredMessage="Duration is required."
								styleClass="form-control">
								<f:selectItem itemLabel="-- Select Duration --"
									itemValue="#{null}" />
								<f:selectItem itemLabel="30 min" itemValue="30" />
								<f:selectItem itemLabel="45 min" itemValue="45" />
								<f:selectItem itemLabel="60 min" itemValue="60" />
							</h:selectOneMenu>
						</div>
						<h:message for="dur" styleClass="error-message" />
					</div>
					
					<!-- Messages above buttons -->
					<h:messages globalOnly="true" layout="table" style="color: #e74c3c; font-weight: bold; display: block; margin: 20px 0; padding: 15px; background: #fdf2f2; border-radius: 5px; border: 1px solid #f5c6cb;"  />

					<!-- Buttons -->
					<div class="form-actions">
						<h:commandButton value="Book Session"
							action="#{ptSessionBean.bookSession}" styleClass="choose-btn" />
						<br /> <br />
						<h:commandButton value="Back to Dashboard"
							action="member-dashboard?faces-redirect=true" immediate="true"
							styleClass="choose-btn btn-secondary" />
					</div>

				</div>
			</div>
		</h:form>

	</main>
</h:body>
</html>
