<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
  <title>Upload your Video</title>
  <h:outputStylesheet library="css" name="membership_select_page.css" />
  <f:metadata>
    <f:event type="preRenderView" listener="#{loginBean.checkLoggedIn}" />
  </f:metadata>
</h:head>

<h:body>
  <ui:include src="/includes/header.xhtml" />

  <main class="main-section">
    <div class="vg-container">
      <h1>Upload your <span class="highlight">Video</span></h1>

      <!-- Global messages for success/error/canceled -->
      <h:messages globalOnly="true" style="margin:12px 0;color:#cbd5e1" />

      <div class="video-gallery">
        <div class="page">
          <div class="grid">

            <!-- LEFT CARD -->
            <div class="card">
              <div class="hd">New Upload</div>
              <div class="bd">
                <p style="margin-top:0;color:#cbd5e1">
                  Click or drag a video into the frame to pick a file.
                </p>

                <!-- UPLOAD FORM -->
                <h:form id="uploadForm" enctype="multipart/form-data">

                  <div class="dropzone" aria-label="Upload area">
                    <div class="dz-icon">📹</div>
                    <div class="dz-title">Drag a video here or click to choose</div>
                    <div class="dz-hint">MP4 or MOV • Max 200MB</div>

                    <h:inputFile id="file"
                                 value="#{videoControllerBean.uploadedFile}"
                                 styleClass="dz-input" />
                  </div>

                  <!-- FIELDS -->
                  <div class="row" style="flex-direction:column;gap:10px;margin-top:12px">
                    <h:outputLabel for="title" value="Title" />
                    <h:inputText id="title"
                                 value="#{videoControllerBean.formTitle}"
                                 styleClass="input" />

                    <h:outputLabel for="date" value="Date (YYYY-MM-DD, optional)" />
                    <h:inputText id="date"
                                 value="#{videoControllerBean.formDate}"
                                 styleClass="input" />

                    <h:outputLabel for="desc" value="Description (optional)" />
                    <h:inputTextarea id="desc"
                                     value="#{videoControllerBean.formDescription}"
                                     rows="3" styleClass="input" />

                    <h:outputLabel for="rule" value="Rule" />
                    <h:selectOneMenu id="rule" value="#{videoControllerBean.formRule}">
                      <f:selectItem itemLabel="Public" itemValue="Public" />
                      <f:selectItem itemLabel="Private" itemValue="Private" />
                      <f:selectItem itemLabel="Hidden" itemValue="Hidden" />
                    </h:selectOneMenu>

                    <h:outputLabel for="cat" value="Category" />
                    <h:selectOneMenu id="cat" value="#{videoControllerBean.formCategory}">
                      <f:selectItem itemLabel="— Choose —" itemValue="" noSelectionOption="true" />
                      <f:selectItem itemLabel="Recently Added" itemValue="Recently Added" />
                      <f:selectItem itemLabel="My Videos"       itemValue="My Videos" />
                      <f:selectItem itemLabel="Yoga"            itemValue="Yoga" />
                      <f:selectItem itemLabel="Pilates"         itemValue="Pilates" />
                      <f:selectItem itemLabel="Zumba"           itemValue="Zumba" />
                      <f:selectItem itemLabel="Core Strength"   itemValue="Core Strength" />
                      <f:selectItem itemLabel="Kickboxing"      itemValue="Kickboxing" />
                      <f:selectItem itemLabel="CrossFit"        itemValue="CrossFit" />
                      <f:selectItem itemLabel="Aqua Aerobics"   itemValue="Aqua Aerobics" />
                      <f:selectItem itemLabel="Tabata"          itemValue="Tabata" />
                      <f:selectItem itemLabel="Tai Chi"         itemValue="Tai Chi" />
                    </h:selectOneMenu>
                  </div> 

                  <!-- BUTTONS -->
                  <div class="row" style="margin-top:12px">
                    <h:commandButton value="Upload"
                                     styleClass="btn primary"
                                     action="#{videoControllerBean.upload}" />
                    <h:commandButton value="Cancel"
                                     styleClass="btn muted"
                                     action="#{videoControllerBean.cancelUpload}"
                                     immediate="true" />
                    <a href="video-gallery.xhtml" class ="btn primary">Go To Video Gallery</a>
                   
                    
                  </div>

                </h:form>
              </div>
            </div>

            <!-- RIGHT CARD: Library -->
            <div class="card">
              <div class="hd">Your Video Library</div>
              <div class="bd">
                <div class="videos">
                  <ui:repeat value="#{videoControllerBean.myVideos}" var="v">
                    <div class="vcard">
                      <video controls="controls" preload="metadata">
                        <source src="#{request.contextPath}#{v.link}" type="video/mp4" />
                      </video>
                      <h3>#{v.title}</h3>
                      <p>Uploaded by: #{v.uploadedBy}</p>
                    </div>
                  </ui:repeat>
                </div>
              </div>
            </div>

          </div><!-- /.grid -->
        </div><!-- /.page -->
      </div><!-- /.video-gallery -->
    </div><!-- /.vg-container -->
  </main>
</h:body>
</html>
