<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

<h:head>
	<title>Upload your Video</title>
	<h:outputStylesheet library="css" name="styles.css" />
	<f:metadata>
		<f:event type="preRenderView" listener="#{loginBean.checkLoggedIn}" />
	</f:metadata>
</h:head>

<h:body>


	<main class="main-section">
		<div class="vg-container">
			<h1>
				Upload your <span class="highlight">Video</span>
			</h1>
			<h:form>
				<h:commandButton value="Back to Dashboard"
					action="personal-trainer-dashboard.xhtml?faces-redirect=true"
					styleClass="choose-btn" />
			</h:form>
			<br></br>
			<!-- Global messages for success/error/canceled -->
			<h:messages id="msgs" globalOnly="true"
				style="margin:12px 0;color:#cbd5e1" />
			<div id="clientFileMsg" class="ui-messages ui-widget"
				style="display: none; margin: 12px 0; color: #cbd5e1">
				<div class="ui-messages-info ui-corner-all">
					<span class="ui-messages-info-icon"></span>
					<ul>
						<li><span class="ui-messages-info-summary">Video
								selected.</span> <span class="ui-messages-info-detail">Ready to
								upload.</span></li>
					</ul>
				</div>
			</div>


			<div class="video-gallery">
				<div class="page">
					<div class="grid">

						<!-- LEFT CARD -->
						<div class="card">
							<div class="hd">New Upload</div>
							<div class="bd">
								<p style="margin-top: 0; color: #cbd5e1">Click or drag a
									video into the frame to pick a file.</p>

								<!-- UPLOAD FORM -->
								<h:form id="uploadForm" enctype="multipart/form-data">

									<div class="dropzone" aria-label="Upload area">
										<div class="dz-icon">📹</div>
										<div class="dz-title">Drag a video here or click to
											choose</div>
										<div class="dz-hint">MP4 or MOV • Max 200MB</div>

										<h:inputFile id="file"
											value="#{videoControllerBean.uploadedFile}"
											styleClass="dz-input"
											onchange="document.getElementById('clientFileMsg').style.display='block';" />
									</div>

									<!-- FIELDS -->
									<div class="row"
										style="flex-direction: column; gap: 10px; margin-top: 12px">
										<h:outputLabel for="title" value="Title" />
										<h:inputText id="title"
											value="#{videoControllerBean.formTitle}" styleClass="input" />

										<h:outputLabel for="date" value="Date (YYYY-MM-DD, optional)" />
										<h:inputText id="date" value="#{videoControllerBean.formDate}"
											styleClass="input" />

										<h:outputLabel for="desc" value="Description (optional)" />
										<h:inputTextarea id="desc"
											value="#{videoControllerBean.formDescription}" rows="3"
											styleClass="input" />

										<h:outputLabel for="rule" value="Rule" />
										<h:selectOneMenu id="rule"
											value="#{videoControllerBean.formRule}">
											<f:selectItem itemLabel="— Choose —" itemValue=""
												noSelectionOption="true" />
											<f:selectItem itemLabel="Public" itemValue="Public" />
											<f:selectItem itemLabel="Private" itemValue="Private" />
											<f:selectItem itemLabel="Hidden" itemValue="Hidden" />
										</h:selectOneMenu>

										<h:outputLabel for="cat" value="Category" />
										<h:selectOneMenu id="cat"
											value="#{videoControllerBean.formCategory}">
											<f:selectItem itemLabel="— Choose —" itemValue=""
												noSelectionOption="true" />
											<f:selectItem itemLabel="Free Weights"
												itemValue="Free Weights" />
											<f:selectItem itemLabel="Bodyweight" itemValue="Bodyweight" />
											<f:selectItem itemLabel="Bands" itemValue="Bands" />
											<f:selectItem itemLabel="Cardio Equipment"
												itemValue="Cardio Equipment" />
											<f:selectItem itemLabel="Machines" itemValue="Machines" />
										</h:selectOneMenu>
									</div>

									<!-- BUTTONS -->
									<div class="row" style="margin-top: 12px">
										<h:commandButton value="Upload" styleClass="btn primary"
											action="#{videoControllerBean.upload}" />
										<h:commandButton value="Cancel" styleClass="btn muted"
											action="#{videoControllerBean.cancelUpload}" immediate="true" />
										<a href="video-gallery.xhtml" class="btn primary">Go To
											Video Gallery</a>


									</div>

								</h:form>
							</div>
						</div>

						<!-- RIGHT CARD: Library -->
						<div class="card">
							<div class="hd">Your Video Library</div>
							<div class="bd">
								<div class="videos">
									<ui:repeat value="#{videoControllerBean.myVideos}" var="v">
										<div class="vcard">
											<video controls="controls" preload="metadata">
												<source src="#{request.contextPath}#{v.link}"
													type="video/mp4" />
											</video>
											<h3>#{v.title}</h3>
											<p>Uploaded by: #{v.uploadedBy}</p>
										</div>
									</ui:repeat>
								</div>
							</div>
						</div>

					</div>
					<!-- /.grid -->
				</div>
				<!-- /.page -->
			</div>
			<!-- /.video-gallery -->
		</div>
		<!-- /.vg-container -->
	</main>
</h:body>
</html>
