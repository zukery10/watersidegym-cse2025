<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
  <title>Video Gallery</title>
  <h:outputStylesheet library="css" name="membership_select_page.css" />
</h:head>

<h:body>
  <ui:include src="/includes/header.xhtml" />

  <main class="main-section">
    <div class="vg-container">
      <div class="vg-titlebar"><h1 class="vg-page-title">Videos</h1></div>

      <section class="vg-section">
        <div class="vg-section-head"><h2 class="vg-section-title">Recently Added</h2></div>
        <div class="vg-grid">
          <ui:repeat value="#{videoControllerBean.recentlyAdded}" var="v">
            <article class="vg-card">
              <div class="vg-thumb">
                <video controls="controls" preload="metadata">
                  <source src="#{request.contextPath}#{v.link}" type="video/mp4" />
                </video>
                <span class="vg-duration">#{v.date}</span>
              </div>
              <div class="vg-meta">
                <h3 class="vg-title">#{v.title}</h3>
                <p class="vg-by">#{v.category} • #{v.rule}</p>
              </div>
            </article>
          </ui:repeat>
        </div>
      </section>

      <section class="vg-section">
        <div class="vg-section-head"><h2 class="vg-section-title">Yoga only</h2></div>
        <div class="vg-grid">
          <ui:repeat value="#{videoControllerBean.yogaOnly}" var="v">
            <article class="vg-card">
              <div class="vg-thumb">
                <video controls="controls" preload="metadata">
                  <source src="#{request.contextPath}#{v.link}" type="video/mp4" />
                </video>
                <span class="vg-duration">#{v.date}</span>
              </div>
              <div class="vg-meta">
                <h3 class="vg-title">#{v.title}</h3>
                <p class="vg-by">#{v.category} • #{v.rule}</p>
              </div>
            </article>
          </ui:repeat>
        </div>
      </section>
    </div>
  </main>
</h:body>
</html>
