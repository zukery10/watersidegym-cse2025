<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<f:metadata>
	<f:event type="preRenderView" listener="#{loginBean.checkLoggedIn}" />
	<f:event type="preRenderView"
		listener="#{membershipBean.checkPaymentSession}" />
</f:metadata>

<h:head>
	<title>Payment</title>
	<link rel="stylesheet" type="text/css"
		href="resources/css/membership_select_page.css" />
</h:head>

<h:body>

	<!--  the nav to be incuded in all pages -->
	<ui:include src="/includes/header.xhtml" />

	<main class="main-section">
		<h1>
			Payment <span class="highlight">Details</span>
		</h1>
		<p class="subtitle">
			You're purchasing: <strong>#{membershipBean.membershipPlan}</strong><br />
			<span style="color: #8fffa0;">Total:
				€#{membershipBean.membershipPrice}</span>
		</p>

		<div class="plan-card payment-form">
			<h:messages globalOnly="true" layout="list"
				styleClass="feedback-message" />
			<!--  if user enters wrong credentials this message will appear -->

			<h:form styleClass="payment-grid">
				<div class="form-field">
					<label for="PayPalEmail">PayPal Email</label>
					<h:inputText id="PayPalEmail" value="#{membershipBean.paypalEmail}"
						required="true">
						<f:passThroughAttribute name="type" value="email" />
					</h:inputText>
				</div>

				<div class="form-field">
					<label for="PayPalPass">PayPal Password</label>
					<h:inputSecret id="PayPalPass"
						value="#{membershipBean.paypalPassword}" required="true"
						maxlength="19" oninput="formatCardNumber(this)" />
				</div>

				<h:commandButton value="Pay with PayPal"
					action="#{membershipBean.processPaymentPayPal}"
					styleClass="paypal-btn" />



			</h:form>

		</div>
		<p class="subtitle2" style="color: red; font-weight: bold;">You
			have 5 minutes to complete your payment before the session expires.</p>

	</main>
</h:body>
</html>
