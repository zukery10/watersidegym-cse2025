<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

<h:head>
	<title>Browse Classes</title>
</h:head>
<h:body>

	<h2>Book Classes</h2>

	<h:form>

		<p:calendar value="#{gymClassBean.selectedDate}" pattern="dd.MM.yy"
			style="padding:10px; margin-bottom:10px; width:150px;" />

		<h:commandButton value="Filter"
			action="#{gymClassBean.getFilteredClassesAction}" />


		<h:dataTable value="#{gymClassBean.filteredClasses}" var="cls"
			border="1" rendered="#{not empty gymClassBean.filteredClasses}">

			<h:column>
				<f:facet name="header">Class Name</f:facet>
                #{cls.nameOfClass}
            </h:column>

			<h:column>
				<f:facet name="header">Date</f:facet>
				<h:outputText value="#{cls.classDate}">
					<f:convertDateTime pattern="dd.MM.yy" />
				</h:outputText>
			</h:column>

			<h:column>
				<f:facet name="header">Time</f:facet>
				<h:outputText value="#{cls.classTime}">
					<f:convertDateTime pattern="HH:mm" />
				</h:outputText>
			</h:column>


			<h:column>
				<f:facet name="header">Slots Available</f:facet>
                #{cls.noOfSlots}
            </h:column>

			<h:column>
				<f:facet name="header">
				</f:facet>
				<h:commandButton value="Book" />
			</h:column>

		</h:dataTable>

	</h:form>

	<!-- Show message if list is empty -->
	<h:panelGroup rendered="#{empty gymClassBean.gymClassList}">
		<h:outputText value="No classes available/scheduled."
			style="color: red;" />
	</h:panelGroup>

</h:body>
</html>
